#k8s.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp
spec:
  replicas: 3
  selector:
    matchLabels:
      app: myapp
  template:
    metadata:
      labels:
        app: myapp
    spec:
      containers:
        - name: myapp
          image: 730335535567.dkr.ecr.ap-southeast-1.amazonaws.com/sarah:latest
          ports:
            - containerPort: 6789

---
apiVersion: v1
kind: Service
metadata:
  name: web-sarah
spec:
  selector:
    app: myapp
  ports:
    - protocol: TCP
      port: 6789
      targetPort: 6789
  type: LoadBalancer
